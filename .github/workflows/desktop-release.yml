name: Windows Debug Artifact
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-debug:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      APP_VARIANT: development
      PASEO_PREVIEW_BUILD: "1"
      PASEO_PREVIEW_BUILD_NUMBER: ${{ github.run_number }}
      PASEO_PREVIEW_EXPO_PROJECT_ID: ${{ vars.PREVIEW_EXPO_PROJECT_ID }}
      PASEO_PREVIEW_EXPO_OWNER: ${{ vars.PREVIEW_EXPO_OWNER }}
      PASEO_PREVIEW_EXPO_SLUG: ${{ vars.PREVIEW_EXPO_SLUG }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Prepare isolated debug packaging
        shell: bash
        run: |
          node scripts/debug-artifact/prepare.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --workspaces --include-workspace-root
      - name: Build Windows x64 test ZIP
        shell: bash
        env:
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:desktop -- --publish never --win --x64 --config electron-builder.debug.local.json
      - name: Verify debug artifact and checksums
        shell: bash
        run: node scripts/debug-artifact/verify.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paseo-plus-plus-debug-windows-x64
          path: |
            packages/desktop/release/*windows-x64.zip
            packages/desktop/release/debug-checksums.sha256
            packages/desktop/release/debug-managed-defaults.json
            debug-build-info.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-debug-build-diagnostics
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7
